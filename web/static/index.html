<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人 LLM 工作台</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #647184;
        --line: #dfe4ea;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --soft: #eef7f5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
      button, input, select { font: inherit; }
      .shell { min-height: 100vh; padding: 28px; }
      .topbar, .panelHeader, .message, .composer, .status { display: flex; }
      .topbar { align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 0; margin: 0 0 6px; text-transform: uppercase; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 30px; }
      h2 { font-size: 18px; }
      .status { align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px 12px; color: var(--muted); }
      .workspace { max-width: 1120px; margin: 0 auto; }
      .chatPanel { min-height: calc(100vh - 120px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; }
      .panelHeader { align-items: center; justify-content: space-between; gap: 16px; padding: 18px; border-bottom: 1px solid var(--line); }
      .panelActions { display: flex; align-items: center; gap: 10px; }
      select, input { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; color: var(--ink); }
      .messages { flex: 1; overflow: auto; padding: 20px; }
      .message { gap: 12px; align-items: flex-start; margin-bottom: 16px; }
      .message.user { flex-direction: row-reverse; }
      .avatar { width: 32px; height: 32px; border-radius: 8px; background: var(--soft); color: var(--accent-strong); display: grid; place-items: center; flex: 0 0 auto; font-size: 13px; font-weight: 700; }
      .message p { max-width: 760px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; line-height: 1.6; white-space: pre-wrap; background: #fff; }
      .message.user p { background: var(--soft); }
      .composer { gap: 10px; padding: 18px; border-top: 1px solid var(--line); }
      .composer input { flex: 1; min-width: 0; }
      button { border: 0; border-radius: 8px; background: var(--accent); color: white; padding: 10px 14px; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.6; }
      .iconButton { width: 42px; height: 42px; display: inline-grid; place-items: center; padding: 0; }
      @media (max-width: 640px) {
        .shell { padding: 16px; }
        .topbar, .panelHeader, .composer { flex-direction: column; align-items: stretch; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">LLM_ml</p>
          <h1>个人 LLM 工作台</h1>
        </div>
        <div class="status"><span id="status">等待后端连接</span></div>
      </section>
      <section class="workspace">
        <div class="chatPanel">
          <div class="panelHeader">
            <div>
              <p class="eyebrow">对话</p>
              <h2>模型对话</h2>
            </div>
            <div class="panelActions">
              <select id="model"></select>
              <button class="iconButton" id="reset" title="新对话" type="button">↻</button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
          <form class="composer" id="composer">
            <input id="input" value="检索科比，并返回他的个人主页" placeholder="输入你想检索或对话的问题" />
            <button id="send" type="submit">发送</button>
          </form>
        </div>
      </section>
    </main>
    <script>
      const apiBaseUrl = "http://127.0.0.1:8001";
      const state = {
        messages: [{ role: "assistant", content: "你好，我是你的个人 LLM 工作台。你可以输入需要检索或对话的问题。" }],
        modelId: "demo-local",
      };
      const messagesEl = document.querySelector("#messages");
      const modelEl = document.querySelector("#model");
      const inputEl = document.querySelector("#input");
      const sendEl = document.querySelector("#send");
      const statusEl = document.querySelector("#status");

      function renderMessages() {
        messagesEl.innerHTML = "";
        for (const [index, message] of state.messages.entries()) {
          const row = document.createElement("div");
          row.className = `message ${message.role}`;
          row.innerHTML = `<div class="avatar">${message.role === "assistant" ? "AI" : "你"}</div><p></p>`;
          row.querySelector("p").textContent = message.content;
          messagesEl.appendChild(row);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      async function loadModels() {
        try {
          const response = await fetch(`${apiBaseUrl}/api/models`);
          const data = await response.json();
          state.modelId = data.default_model_id || "demo-local";
          modelEl.innerHTML = "";
          for (const model of data.models || []) {
            const option = document.createElement("option");
            option.value = model.model_id;
            option.textContent = model.label;
            modelEl.appendChild(option);
          }
          modelEl.value = state.modelId;
          statusEl.textContent = "后端已连接";
        } catch (error) {
          statusEl.textContent = `无法连接后端：${error.message}`;
        }
      }

      document.querySelector("#composer").addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = inputEl.value.trim();
        if (!content) return;
        state.modelId = modelEl.value;
        state.messages.push({ role: "user", content });
        state.messages.push({ role: "assistant", content: `正在调用模型 ${state.modelId}...` });
        inputEl.value = "";
        sendEl.disabled = true;
        renderMessages();
        try {
          const response = await fetch(`${apiBaseUrl}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model_id: state.modelId,
              messages: state.messages.filter((message) => !message.content.startsWith("正在调用模型")),
            }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
          state.messages[state.messages.length - 1] = { role: "assistant", content: data.content || "没有返回内容。" };
        } catch (error) {
          state.messages[state.messages.length - 1] = { role: "assistant", content: `后端调用失败：${error.message}` };
        } finally {
          sendEl.disabled = false;
          renderMessages();
        }
      });

      document.querySelector("#reset").addEventListener("click", () => {
        state.messages = [{ role: "assistant", content: "你好，我是你的个人 LLM 工作台。你可以输入需要检索或对话的问题。" }];
        inputEl.value = "";
        renderMessages();
      });

      modelEl.addEventListener("change", () => {
        state.modelId = modelEl.value;
      });

      renderMessages();
      loadModels();
    </script>
  </body>
</html>
